[project]
name = "tennis-etl"
version = "0.1.0"
description = "Tennis data pipeline: extraction, validation, Elo computation and loading."
requires-python = "==3.12.*"
dependencies = []

[dependency-groups]
dev = [
  "mypy",
  "pytest",
  "pytest-cov",
  "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tennis_etl"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "C90", "SIM", "PL", "RUF", "S", "PT", "D"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests use assert statements (S101) and need no docstrings (D).
"tests/**" = ["S101", "D"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = ["src"]
warn_unreachable = true
enable_error_code = ["redundant-expr", "truthy-bool", "ignore-without-code"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
  "--strict-markers",
  "--strict-config",
  "--cov=tennis_etl",
  "--cov-report=term-missing",
  "--cov-report=xml",
  "--cov-fail-under=85",
]

[tool.coverage.run]
branch = true
source = ["src/tennis_etl"]
